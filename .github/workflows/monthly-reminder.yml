# Opens a reminder issue on the 1st of every month to check the Mobalytics tier list.
# It does not contact Mobalytics; the update itself is manual (see "Updating the tier list" in README.md).
name: Monthly tier list reminder

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open reminder issue (unless one is already open)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Monthly check: Mobalytics tier list"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number' | grep -q .; then
            echo "A reminder is already open."
            exit 0
          fi
          last=$(curl -fsSL "https://raw.githubusercontent.com/${GH_REPO}/${GITHUB_REF_NAME}/data/tiers.json" | jq -r '._updated // "unknown"')
          gh issue create --title "$title" --body "$(cat <<BODY
          Time to check whether the [Mobalytics card tier list](https://mobalytics.gg/slay-the-spire-2/tier-lists/cards) changed.
          Current data in the repo is from **${last}**.

          1. Open the tier list page and run \`tools/extract-tiers.js\` (bookmark or console).
          2. Run \`.\tools\publish-tiers.ps1\`. It shows what changed and pushes it.
          3. Close this issue. If nothing changed, just close it.

          Details: README > Updating the tier list.
          BODY
          )"
